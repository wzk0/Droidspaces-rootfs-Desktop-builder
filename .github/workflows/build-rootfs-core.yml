name: Droidspaces RootFS 核心构建

# 单一流水线：Fedora 45 + GNOME（Anland Wayland）。
# 由 build-rootfs-releases.yml 调用，也可以被其它入口以 workflow_call 复用。

on:
  workflow_call:
    inputs:
      custom_username:
        required: false
        type: string
        default: Gold
      desktop:
        required: true
        type: string
      desktop_autostart:
        required: true
        type: boolean
      display_backend:
        required: true
        type: string
      PulseAudio:
        required: true
        type: string
      enable_zh_tz:
        required: true
        type: boolean
      enable_mesa:
        required: true
        type: boolean
      enable_8gen2_wayland:
        required: true
        type: boolean
      enable_srf:
        required: true
        type: boolean
      enable_binfmt:
        required: true
        type: boolean
      enable_yj:
        required: true
        type: boolean
      enable_kfgj:
        required: true
        type: boolean
      enable_zip:
        required: true
        type: boolean
      enable_docker:
        required: true
        type: boolean
      wayland_package_repository:
        required: false
        type: string
        default: Goldzxcbug/droidspaces-package
      build_id:
        required: false
        type: string
        default: ''
      publish_release:
        required: false
        type: boolean
        default: true

jobs:
  # --------------------------------------------------------
  # Phase 1: 解析构建选项
  # --------------------------------------------------------
  setup:
    name: 准备构建
    runs-on: ubuntu-latest
    outputs:
      template: ${{ steps.resolve.outputs.template }}
      desktop: ${{ steps.resolve.outputs.desktop }}
      display_backend: ${{ steps.resolve.outputs.display_backend }}
      desktop_autostart: ${{ steps.resolve.outputs.desktop_autostart }}
      pulseaudio: ${{ steps.resolve.outputs.pulseaudio }}
      build_id: ${{ steps.prep.outputs.build_id }}
      build_date: ${{ steps.prep.outputs.build_date }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 解析构建选项
        id: resolve
        env:
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP_INPUT: ${{ inputs.desktop }}
          DESKTOP_AUTOSTART_INPUT: ${{ inputs.desktop_autostart }}
          DISPLAY_BACKEND_INPUT: ${{ inputs.display_backend }}
          PULSEAUDIO_INPUT: ${{ inputs.PulseAudio }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
        run: |
          set -euo pipefail
          source scripts/lib/desktop-config.sh

          TEMPLATE="Fedora-45"
          fail() { printf '%s\n' "$1" >&2; exit 1; }

          if [[ ! "$WAYLAND_PACKAGE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail "Wayland 软件包仓库必须使用公开的“所有者/仓库名”格式。"
          fi
          if [[ ! "$CUSTOM_USERNAME" =~ ^[A-Za-z_][A-Za-z0-9_-]{0,31}$ ]]; then
            fail "自定义用户名必须是 1 至 32 个字符的有效 Linux 用户名。"
          fi

          DESKTOP="$(desktop_normalize "$DESKTOP_INPUT")" || fail "无效的桌面环境：$DESKTOP_INPUT"
          if [ "$DESKTOP" = "none" ]; then
            DISPLAY_BACKEND="x11"
            DESKTOP_AUTOSTART="false"
            echo "桌面环境为 none：强制使用 x11 并关闭桌面自启动。"
          else
            DISPLAY_BACKEND="$(display_backend_normalize "$DISPLAY_BACKEND_INPUT")" || \
              fail "无效的显示后端：$DISPLAY_BACKEND_INPUT"
            DESKTOP_AUTOSTART="$DESKTOP_AUTOSTART_INPUT"
          fi

          case "$DESKTOP:$DISPLAY_BACKEND" in
            none:x11) ;;
            gnome:anland-wayland) ;;
            *)
              fail "不支持的桌面/显示后端组合：$DESKTOP/$DISPLAY_BACKEND（GNOME 只能使用 Anland Wayland）"
              ;;
          esac
          desktop_backend_supported "$TEMPLATE" "$DESKTOP" "$DISPLAY_BACKEND" || \
            fail "不支持的发行版、桌面和显示后端组合：$TEMPLATE/$DESKTOP/$DISPLAY_BACKEND"

          case "$PULSEAUDIO_INPUT" in
            socket|tcp|none) ;;
            *) fail "无效的 PulseAudio 设置：$PULSEAUDIO_INPUT" ;;
          esac
          PULSE_AUDIO="$PULSEAUDIO_INPUT"
          if [ "$DISPLAY_BACKEND" = "anland-wayland" ]; then
            PULSE_AUDIO="none"
          fi

          {
            echo "template=$TEMPLATE"
            echo "desktop=$DESKTOP"
            echo "display_backend=$DISPLAY_BACKEND"
            echo "desktop_autostart=$DESKTOP_AUTOSTART"
            echo "pulseaudio=$PULSE_AUDIO"
          } >> "$GITHUB_OUTPUT"

          printf '构建目标：%s\n桌面环境：%s\n显示后端：%s\n桌面自启动：%s\nPulseAudio：%s\nWayland 软件包仓库：%s\n' \
            "$TEMPLATE" "$(desktop_label "$DESKTOP")" "$(display_backend_label "$DISPLAY_BACKEND")" \
            "$DESKTOP_AUTOSTART" "$PULSE_AUDIO" "$WAYLAND_PACKAGE_REPOSITORY"

      - name: 生成构建信息
        id: prep
        env:
          BUILD_ID_INPUT: ${{ inputs.build_id }}
        run: |
          echo "build_date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
          BUILD_ID="${BUILD_ID_INPUT:-v$(date +'%Y%m%d-%H%M%S')}"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "构建 ID：$BUILD_ID"

  # --------------------------------------------------------
  # Phase 2: 构建 RootFS
  # --------------------------------------------------------
  build:
    name: 构建 ${{ needs.setup.outputs.template }}/${{ needs.setup.outputs.desktop }}
    needs: setup
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 构建根文件系统
        env:
          ANLAND_RELEASE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
        run: |
          chmod +x build_rootfs-native.sh
          ./build_rootfs-native.sh \
            -i "${{ needs.setup.outputs.template }}.Dockerfile" \
            -v "${{ needs.setup.outputs.build_id }}" \
            -K "${{ needs.setup.outputs.desktop }}" \
            -L "${{ needs.setup.outputs.desktop_autostart }}" \
            -B "${{ needs.setup.outputs.display_backend }}" \
            -P "${{ needs.setup.outputs.pulseaudio }}" \
            -g "${{ inputs.enable_zh_tz }}" \
            -a "${{ inputs.enable_binfmt }}" \
            -b "${{ inputs.enable_yj }}" \
            -c "${{ inputs.enable_mesa }}" \
            -d "${{ inputs.enable_kfgj }}" \
            -e "${{ inputs.enable_zip }}" \
            -f "${{ inputs.enable_docker }}" \
            -h "${{ inputs.enable_srf }}" \
            -t "${{ inputs.enable_8gen2_wayland }}" \
            -u "$CUSTOM_USERNAME"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: ${{ needs.setup.outputs.template }}-${{ needs.setup.outputs.desktop }}-rootfs
          path: "*.tar.xz"
          retention-days: 1

  # --------------------------------------------------------
  # Phase 3: 发布
  # --------------------------------------------------------
  release:
    name: 发布构建结果
    needs: [setup, build]
    if: ${{ inputs.publish_release && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: 下载全部构建产物
        uses: actions/download-artifact@v7
        with:
          pattern: "*-rootfs"
          merge-multiple: true

      - name: 整理发布文件
        run: |
          mkdir -p release_assets
          mv *.tar.xz release_assets/

      - name: 生成发布说明
        env:
          BUILD_TIME: ${{ needs.setup.outputs.build_date }}
          BUILD_ID: ${{ needs.setup.outputs.build_id }}
          BUILD_TEMPLATE: ${{ needs.setup.outputs.template }}
          CUSTOM_USERNAME: ${{ inputs.custom_username }}
          DESKTOP: ${{ needs.setup.outputs.desktop }}
          DISPLAY_BACKEND: ${{ needs.setup.outputs.display_backend }}
          DESKTOP_AUTOSTART: ${{ needs.setup.outputs.desktop_autostart }}
          PULSE_AUDIO: ${{ needs.setup.outputs.pulseaudio }}
          WAYLAND_PACKAGE_REPOSITORY: ${{ inputs.wayland_package_repository }}
          ENABLE_ZH_TZ: ${{ inputs.enable_zh_tz }}
          ENABLE_MESA: ${{ inputs.enable_mesa }}
          ENABLE_8GEN2_WAYLAND: ${{ inputs.enable_8gen2_wayland }}
          ENABLE_FCITX5: ${{ inputs.enable_srf }}
          ENABLE_BINFMT: ${{ inputs.enable_binfmt }}
          ENABLE_HARDWARE: ${{ inputs.enable_yj }}
          ENABLE_DEV_TOOLS: ${{ inputs.enable_kfgj }}
          ENABLE_COMPRESSION: ${{ inputs.enable_zip }}
          ENABLE_DOCKER: ${{ inputs.enable_docker }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Droidspaces 根文件系统自动构建
          构建时间：$BUILD_TIME
          构建目标：$BUILD_TEMPLATE
          构建 ID：$BUILD_ID

          构建选项：
          - **自定义用户名**：$CUSTOM_USERNAME
          - **桌面环境**：$DESKTOP
          - **显示后端**：$DISPLAY_BACKEND
          - **桌面开机自启动**：$DESKTOP_AUTOSTART
          - Wayland 软件包仓库：$WAYLAND_PACKAGE_REPOSITORY
          - PulseAudio 音频转发：$PULSE_AUDIO（Anland 使用内置音频，Wayland 下自动关闭）
          - 使用中文并设置上海时区：$ENABLE_ZH_TZ
          - 高通骁龙 GPU 支持：$ENABLE_MESA
          - 修复骁龙 8 Gen 2 Wayland 显示异常：$ENABLE_8GEN2_WAYLAND
          - Fcitx 5 输入法支持：$ENABLE_FCITX5
          - 跨架构支持：$ENABLE_BINFMT
          - 容器硬件和网络识别：$ENABLE_HARDWARE
          - 开发工具：$ENABLE_DEV_TOOLS
          - 压缩工具：$ENABLE_COMPRESSION
          - Docker：$ENABLE_DOCKER
          EOF

      - name: 创建草稿 Release 并上传文件
        id: stage-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.build_id }}
          target_commitish: ${{ github.sha }}
          name: Droidspaces 根文件系统 ${{ needs.setup.outputs.build_id }}
          files: "release_assets/*"
          body_path: release-notes.md
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 发布已验证的 Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.stage-release.outputs.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$RELEASE_ID" in
            ''|*[!0-9]*)
              echo "Release 操作没有返回有效的草稿 Release ID。" >&2
              exit 1
              ;;
          esac
          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
          echo "Release ${{ needs.setup.outputs.build_id }} 已发布。"