name: 编译并发布 Droidspaces RootFS

# 唯一流水线：Fedora 45 + GNOME（Anland Wayland）。
# GNOME 需要预编译的 Anland Mutter；上游仓库尚未发布 fedora45 资产时，
# 把 wayland_package_repository 指向自建的包仓库。

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: 桌面环境
        required: true
        type: choice
        default: GNOME
        options:
          - GNOME
          - none
      desktop_autostart:
        description: 桌面开机自启动（桌面为 none 时自动关闭）
        required: true
        type: boolean
        default: true
      display_backend:
        description: 显示后端（GNOME 固定使用 Anland Wayland）
        required: true
        type: choice
        default: anland-wayland
        options:
          - anland-wayland
          - x11
      PulseAudio:
        description: PulseAudio 音频转发（Anland Wayland 下自动关闭）
        required: true
        type: choice
        default: none
        options:
          - none
          - socket
          - tcp
      enable_zh_tz:
        description: 使用中文并设置上海时区
        required: true
        type: boolean
        default: true
      enable_mesa:
        description: 开启高通骁龙 GPU 支持（Anland Wayland 必需）
        required: true
        type: boolean
        default: true
      enable_8gen2_wayland:
        description: 修复骁龙 8 Gen 2 Wayland 花屏
        required: true
        type: boolean
        default: false
      enable_srf:
        description: 安装 Fcitx5 输入法
        required: true
        type: boolean
        default: true
      enable_binfmt:
        description: 开启跨架构支持
        required: true
        type: boolean
        default: false
      enable_yj:
        description: 开启 NAT 和硬件识别
        required: true
        type: boolean
        default: true
      enable_kfgj:
        description: 安装开发工具
        required: true
        type: boolean
        default: false
      enable_zip:
        description: 安装压缩工具
        required: true
        type: boolean
        default: true
      enable_docker:
        description: 安装 Docker
        required: true
        type: boolean
        default: false
      wayland_package_repository:
        description: Wayland 软件包仓库（公开的 owner/repository）
        required: true
        type: string
        default: Goldzxcbug/droidspaces-package

permissions:
  contents: write

jobs:
  build:
    name: 构建
    uses: ./.github/workflows/build-rootfs-core.yml
    with:
      desktop: ${{ inputs.desktop }}
      desktop_autostart: ${{ inputs.desktop_autostart }}
      display_backend: ${{ inputs.display_backend }}
      PulseAudio: ${{ inputs.PulseAudio }}
      enable_zh_tz: ${{ inputs.enable_zh_tz }}
      enable_mesa: ${{ inputs.enable_mesa }}
      enable_8gen2_wayland: ${{ inputs.enable_8gen2_wayland }}
      enable_srf: ${{ inputs.enable_srf }}
      enable_binfmt: ${{ inputs.enable_binfmt }}
      enable_yj: ${{ inputs.enable_yj }}
      enable_kfgj: ${{ inputs.enable_kfgj }}
      enable_zip: ${{ inputs.enable_zip }}
      enable_docker: ${{ inputs.enable_docker }}
      wayland_package_repository: ${{ inputs.wayland_package_repository }}